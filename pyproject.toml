[project]
name = "worklist"
version = "0.1.0"
description = "Renewal risk worklist for Customer Success Managers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "anthropic>=0.40",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
worklist = "worklist.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worklist"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# SQL, SVG and signal-registry text are clearer unwrapped.
"tests/**" = ["E501"]
"src/worklist/signals/registry.py" = ["E501"]
"src/worklist/web/routes/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
strict_optional = false  # SQLAlchemy rows are Optional everywhere; routes 404 on None explicitly

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: slow suites that train models on the full generated dataset"]
addopts = "-m 'not model'"
